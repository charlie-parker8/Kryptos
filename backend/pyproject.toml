[project]
name = "kryptos-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "truststore>=0.9",
    "bcrypt>=4.1",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# session-scoped so the session-scoped `engine` fixture in conftest.py shares a loop with
# the tests and function-scoped fixtures (e.g. db_session) that use it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "network: requires real network access to Kraken; run explicitly with `pytest -m network`",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
