name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: "3.12"
      # conftest.py hard-codes these same targets; setting them here keeps the
      # import-time engine/redis client (bound before the test fixtures override them)
      # pointed at the CI services rather than a missing dev .env.
      KRYPTOS_DATABASE_URL: postgresql+asyncpg://kryptos:kryptos@localhost:5432/kryptos_test
      KRYPTOS_REDIS_URL: redis://localhost:6379/1

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kryptos
          POSTGRES_PASSWORD: kryptos
          POSTGRES_DB: kryptos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kryptos -d kryptos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Tests (pytest)
        run: uv run pytest -m "not network and not benchmark"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build
